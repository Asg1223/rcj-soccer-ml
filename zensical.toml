[project]
site_url = "https://asg1223.github.io/rcj-soccer-ml/"
site_name = "RCJ Soccer 機械学習入門"
site_description = "ロボカップジュニア サッカー（赤外線）で使う機械学習を、手を動かして身につける教材"
site_author = "Asg1223"
copyright = "Copyright &copy; 2026 Asg1223 ・ <a href=\"https://github.com/Asg1223/rcj-soccer-ml/blob/main/LICENSE\">MIT License</a>"

repo_url = "https://github.com/Asg1223/rcj-soccer-ml"
repo_name = "Asg1223/rcj-soccer-ml"
edit_uri = "edit/main/docs/"

nav = [
  { "はじめに" = "index.md" },
  { "第0部 準備" = [
    "part0-setup/index.md",
    { "0-1 この教材の使い方" = "part0-setup/how-to-use.md" },
    { "0-2 環境構築" = "part0-setup/environment.md" },
    { "0-3 GitHub とチーム用リポジトリ" = "part0-setup/github.md" },
    { "0-4 設定ファイル" = "part0-setup/config.md" },
  ] },
  { "第1部 IR データを集める" = [
    "part1-ir-data/index.md",
    { "1-1 IR ボールとセンサの仕組み" = "part1-ir-data/ball-and-sensor.md" },
    { "1-2 センサリングの値を読む" = "part1-ir-data/read-sensors.md" },
    { "1-3 PC に送る" = "part1-ir-data/send-to-pc.md" },
    { "1-4 正解ラベルをつける" = "part1-ir-data/labels.md" },
    { "1-5 データを眺める" = "part1-ir-data/explore.md" },
  ] },
  { "第2部 機械学習の基本" = [
    "part2-ml-basics/index.md",
    { "2-1 従来の方法（ベースライン）" = "part2-ml-basics/baseline.md" },
    { "2-2 線形回帰と勾配降下法" = "part2-ml-basics/linear-regression.md" },
    { "2-3 角度は輪っか" = "part2-ml-basics/angle-ring.md" },
    { "2-4 正しく評価する" = "part2-ml-basics/evaluation.md" },
    { "2-5 scikit-learn で数行に" = "part2-ml-basics/scikit-learn.md" },
  ] },
  { "第3部 ニューラルネット" = [
    "part3-neural-net/index.md",
    { "3-1 ニューロンと層" = "part3-neural-net/neurons.md" },
    { "3-2 Keras で MLP" = "part3-neural-net/keras-mlp.md" },
    { "3-3 過学習とデータの量" = "part3-neural-net/overfitting.md" },
    { "3-4 分類：保持の判定" = "part3-neural-net/classification.md" },
    { "3-5 データ拡張" = "part3-neural-net/augmentation.md" },
  ] },
  { "第4部 マイコンに載せる" = [
    "part4-on-device/index.md",
    { "4-1 C で動かす" = "part4-on-device/export-c.md" },
    { "4-2 メモリと速さを測る" = "part4-on-device/measure.md" },
    { "4-3 量子化" = "part4-on-device/quantization.md" },
    { "4-4 TensorFlow Lite Micro" = "part4-on-device/tflite-micro.md" },
  ] },
  { "第5部 2台をつなぐ" = [
    "part5-two-boards/index.md",
    { "5-1 役割分担を決める" = "part5-two-boards/design.md" },
    { "5-2 パケットを設計する" = "part5-two-boards/packet.md" },
    { "5-3 CoreS3 に表示する" = "part5-two-boards/display.md" },
    { "5-4 データ収集モード" = "part5-two-boards/collect.md" },
    { "5-5 制御ループに組み込む" = "part5-two-boards/control.md" },
  ] },
  { "第6部 カメラ認識" = [
    "part6-camera/index.md",
    { "6-1 画像は数字の表" = "part6-camera/pixels.md" },
    { "6-2 色で探す（HSV）" = "part6-camera/hsv-baseline.md" },
    { "6-3 画像を集める" = "part6-camera/collect-images.md" },
    { "6-4 ラベルを付ける" = "part6-camera/labeling.md" },
    { "6-5 CNN" = "part6-camera/cnn.md" },
    { "6-6 物体検出" = "part6-camera/detection.md" },
    { "6-7 CoreS3 で速く動かす" = "part6-camera/speed.md" },
    { "6-8 相手ロボット" = "part6-camera/robots.md" },
    { "6-9 IR とカメラの融合" = "part6-camera/fusion.md" },
  ] },
  { "第7部 発展" = [
    "part7-advanced/index.md",
    { "7-1 会場での調整" = "part7-advanced/calibration.md" },
    { "7-2 ボールがないとき" = "part7-advanced/no-ball.md" },
    { "7-3 模倣学習" = "part7-advanced/imitation.md" },
    { "7-4 追跡と自己位置" = "part7-advanced/tracking.md" },
  ] },
]

extra_css = [
  "stylesheets/extra.css",
  "https://unpkg.com/katex@0/dist/katex.min.css",
]
extra_javascript = [
  "javascripts/katex.js",
  "https://unpkg.com/katex@0/dist/katex.min.js",
  "https://unpkg.com/katex@0/dist/contrib/auto-render.min.js",
]

[project.theme]
language = "ja"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/radar"

[project.theme.font]
text = "BIZ UDPGothic"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "ライトモードにする"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep orange"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "ダークモードにする"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep orange"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "システム設定に合わせる"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Asg1223/rcj-soccer-ml"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
